name: Scraper de desastres

on:
  schedule:
    # Cada 2 horas. Minuto no redondo a propósito: los horarios en punto están
    # congestionados en GitHub Actions y las corridas programadas se demoran o
    # se saltean.
    #
    # Antes era semanal, y para una app de alertas eso es demasiado: un sismo
    # de hoy aparecía recién el lunes siguiente. La ventana de los feeds cubre
    # 7 días (ver fuentes/usgs.py), así que acortar el intervalo es seguro
    # —sobra cobertura—; lo que NO se puede es espaciarlo más allá de esa
    # ventana sin pasar a la API de consulta por rango, o se pierden eventos.
    #
    # El costo de correr seguido no es el tiempo de cómputo sino el peso que le
    # suma al repo cada commit de datos; por eso el histórico completo se
    # commitea una vez por día y no en cada corrida (ver "Commitear los datos").
    - cron: "23 */2 * * *"
  workflow_dispatch:
    inputs:
      fuentes:
        description: "Fuentes a consultar (separadas por coma)"
        default: "usgs,gdacs"
        required: false
      dry_run:
        description: "Consultar sin escribir ni commitear"
        type: boolean
        default: false

permissions:
  contents: write

# Dos corridas simultáneas commitearían sobre el mismo archivo y una perdería.
concurrency:
  group: scraper
  cancel-in-progress: false

jobs:
  scrapear:
    runs-on: ubuntu-latest
    # Con el presupuesto propio de la búsqueda de noticias (9 min, ver
    # noticias.PRESUPUESTO_POR_DEFECTO) esto no debería hacer falta, pero
    # queda como red de seguridad ante lo que no se previó.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ejecutar el scraper
        id: scraper
        run: |
          set +e
          python -m desastres \
            --fuentes "${{ inputs.fuentes || 'usgs,gdacs' }}" \
            --salida datos \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            | tee resumen.txt
          echo "codigo=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
        env:
          PYTHONPATH: src

      - name: Publicar el resumen de la corrida
        if: always()
        run: |
          {
            echo "## Resumen del scraper"
            echo '```json'
            cat resumen.txt 2>/dev/null || echo "(sin salida)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Avisar de fuentes caídas
        if: steps.scraper.outputs.codigo == '2'
        run: echo "::warning::Alguna fuente falló; se guardó lo que sí respondió."

      - name: Fallar si no respondió ninguna fuente
        if: steps.scraper.outputs.codigo == '1'
        run: |
          echo "::error::Todas las fuentes fallaron; el histórico quedó intacto."
          exit 1

      - name: Commitear los datos nuevos
        if: steps.scraper.outputs.codigo != '1' && !inputs.dry_run
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Lo que lee la app va en toda corrida; el histórico completo, una vez
          # por día.
          #
          # `eventos.json` pesa ~12 MB y se reescribe entero en cada corrida.
          # Commitearlo doce veces por día le sumaría al repo varios GB al año,
          # y este repo además se sirve por jsDelivr: cuanto más pesa, más tarda
          # todo. `recientes.json` (~1 MB) es el único que baja la app, así que
          # ese sí va siempre.
          #
          # No commitear el histórico en cada corrida no pierde nada: la corrida
          # siguiente arranca del último commiteado y vuelve a pedir la ventana
          # de 7 días de los feeds, así que todo lo de esos 7 días se
          # reconstruye solo. Mientras el commit del histórico sea más seguido
          # que esa ventana —una vez por día lo es de sobra— no hay agujero.
          git add datos/recientes.json datos/resumen.json
          git add datos/noticias.json 2>/dev/null || true
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] || [ "$(date -u +%H)" = "06" ]; then
            echo "Corrida diaria: se commitea también el histórico completo."
            git add datos/eventos.json datos/eventos.csv
          fi
          # resumen.json cambia en toda corrida (lleva la marca de tiempo), así
          # que en la práctica siempre hay algo que commitear. El guard queda
          # igual porque `git commit` sin cambios devuelve error.
          if git diff --staged --quiet; then
            echo "Sin novedades en los feeds."
            exit 0
          fi
          git commit -m "datos: actualización automática $(date -u +'%Y-%m-%dT%H:%MZ')"
          # Si alguien empujó mientras corríamos, rebasamos encima y reintentamos.
          git push || {
            git pull --rebase --autostash origin "$GITHUB_REF_NAME"
            git push
          }
