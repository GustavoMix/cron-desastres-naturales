name: App Android

on:
  push:
    # Filtro por ruta: los commits de datos del scraper (uno por corrida) no
    # tienen por qué disparar un build de Android de varios minutos.
    paths:
      - "app-android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "app-android/**"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: app-android

jobs:
  core:
    name: "core (Kotlin/JVM)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: app-android

      # :core no depende del SDK de Android a propósito: toda la lógica que
      # puede fallar se testea acá, sin emulador y en segundos.
      - run: ./gradlew :core:test

  apk:
    name: "APK de debug"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: app-android

      # Los runners de GitHub ya traen el SDK de Android instalado.
      - run: ./gradlew :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: desastres-debug-apk
          path: app-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
