[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cron-desastres-naturales"
version = "1.0.0"
description = "Scraper programado de alertas de desastres naturales (USGS + GDACS)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# pycountry solo hace falta para regenerar src/desastres/paises.py con
# herramientas/generar_paises.py; el scraper en sí no tiene dependencias.
dev = ["pytest>=8.0", "ruff>=0.6", "pycountry>=24.0"]

[project.scripts]
desastres = "desastres.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
